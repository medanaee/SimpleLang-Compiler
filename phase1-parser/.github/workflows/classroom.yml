name: Autograding Tests
'on':
- push
- repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: test1
      id: test1
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: test1
        setup-command: ''
        command: javac -cp utilities/antlr-4.13.1-complete.jar -d out $(find src gen
          -name "*.java") && java -cp out:utilities/antlr-4.13.1-complete.jar SimpleLang
          "samples/sample1.sl" | sort -t':' -k1.6n -k2
        input: ''
        expected-output: 'Line: 1 | Name: counter_bank | Number of ports: 0 | Number
          of component items: 10 | Number of repeat loops: 6'
        comparison-method: contains
        timeout: 10
        max-score: 1
    - name: test2
      id: test2
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: test2
        setup-command: ''
        command: javac -cp utilities/antlr-4.13.1-complete.jar -d out $(find src gen
          -name "*.java") && java -cp out:utilities/antlr-4.13.1-complete.jar SimpleLang
          "samples/sample2.sl" | sort -t':' -k1.6n -k2
        input: ''
        expected-output: 'Line: 1 | Name: matrix_multiplication | Number of ports:
          0 | Number of component items: 14 | Number of repeat loops: 5'
        comparison-method: contains
        timeout: 10
        max-score: 1
    - name: test3
      id: test3
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: test3
        setup-command: ''
        command: javac -cp utilities/antlr-4.13.1-complete.jar -d out $(find src gen
          -name "*.java") && java -cp out:utilities/antlr-4.13.1-complete.jar SimpleLang
          "samples/sample3.sl" | sort -t':' -k1.6n -k2
        input: ''
        expected-output: 'Line: 1 | Name: fifo_demo | Number of ports: 0 | Number
          of component items: 26 | Number of repeat loops: 14'
        comparison-method: contains
        timeout: 10
        max-score: 1
    - name: test4
      id: test4
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: test4
        setup-command: ''
        command: javac -cp utilities/antlr-4.13.1-complete.jar -d out $(find src gen
          -name "*.java") && java -cp out:utilities/antlr-4.13.1-complete.jar SimpleLang
          "samples/sample4.sl" | sort -t':' -k1.6n -k2
        input: ''
        expected-output: |-
          Line: 1 | Name: Incrementer | Number of ports: 2 | Number of component items: 1 | Number of repeat loops: 0
          Line: 8 | Name: Multiplier | Number of ports: 3 | Number of component items: 1 | Number of repeat loops: 0
          Line: 16 | Name: Top_Basic | Number of ports: 3 | Number of component items: 7 | Number of repeat loops: 4
          Line: 23 | ComponentType: Incrementer | Instances: u_inc | Number of ports: 2
          Line: 28 | ComponentType: Multiplier | Instances: u_mul | Number of ports: 3
        comparison-method: contains
        timeout: 10
        max-score: 1
    - name: test5
      id: test5
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: test5
        setup-command: ''
        command: javac -cp utilities/antlr-4.13.1-complete.jar -d out $(find src gen
