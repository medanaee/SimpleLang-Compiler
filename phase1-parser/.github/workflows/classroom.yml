          Line: 23 | ComponentType: FDRE | Instances: ff | Number of ports: 5
          Line: 30 | Name: Top_Counters | Number of ports: 5 | Number of component items: 5 | Number of repeat loops: 0
          Line: 38 | ComponentType: BUFG | Instances: b0 | Number of ports: 2
          Line: 39 | ComponentType: BUFG | Instances: b1 | Number of ports: 2
          Line: 40 | ComponentType: CounterN | Instances: u0 | Number of ports: 3
          Line: 41 | ComponentType: CounterN | Instances: u1 | Number of ports: 3
          Line: 44 | Name: Scenario | Number of ports: 0 | Number of component items: 9 | Number of repeat loops: 6
          Line: 48 | ComponentType: Top_Counters | Instances: dut | Number of ports: 5
        comparison-method: contains
        timeout: 10
        max-score: 1
    - name: test10
      id: test10
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: test10
        setup-command: ''
        command: javac -cp utilities/antlr-4.13.1-complete.jar -d out $(find src gen
          -name "*.java") && java -cp out:utilities/antlr-4.13.1-complete.jar SimpleLang
          "samples/sample10.sl" | sort -t':' -k1.6n -k2
        input: ''
        expected-output: 'Line: 1 | Name: fib_demo | Number of ports: 0 | Number of
          component items: 7 | Number of repeat loops: 4'
        comparison-method: contains
        timeout: 10
        max-score: 1
    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        TEST1_RESULTS: "${{steps.test1.outputs.result}}"
        TEST2_RESULTS: "${{steps.test2.outputs.result}}"
        TEST3_RESULTS: "${{steps.test3.outputs.result}}"
        TEST4_RESULTS: "${{steps.test4.outputs.result}}"
        TEST5_RESULTS: "${{steps.test5.outputs.result}}"
        TEST6_RESULTS: "${{steps.test6.outputs.result}}"
        TEST7_RESULTS: "${{steps.test7.outputs.result}}"
        TEST8_RESULTS: "${{steps.test8.outputs.result}}"
        TEST9_RESULTS: "${{steps.test9.outputs.result}}"
        TEST10_RESULTS: "${{steps.test10.outputs.result}}"
      with:
        runners: test1,test2,test3,test4,test5,test6,test7,test8,test9,test10
