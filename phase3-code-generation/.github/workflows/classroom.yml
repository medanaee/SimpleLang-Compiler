name: Autograding Tests
'on':
- push
- repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: type1-1
      id: type1-1
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: type1-1
        setup-command: ''
        command: javac -cp utilities/antlr-4.13.1-complete.jar -d out $(find src gen
          -name "*.java") && java -cp out:utilities/antlr-4.13.1-complete.jar SimpleLang
          "samples/type1-1.sl"
        input: ''
        expected-output: |-
          1 0 0
          0 1 0
          1 0 1
          0 2 1
          2 1 2
          1 4 2
        comparison-method: contains
        timeout: 10
        max-score: 1
    - name: type1-2
      id: type1-2
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: type1-2
        setup-command: ''
        command: javac -cp utilities/antlr-4.13.1-complete.jar -d out $(find src gen
          -name "*.java") && java -cp out:utilities/antlr-4.13.1-complete.jar SimpleLang
          "samples/type1-2.sl"
        input: ''
        expected-output: |-
          0 1 0
          1 0 1
          0 1 1
          1 1 1
          1 1 2
          1 2 2
        comparison-method: contains
        timeout: 10
        max-score: 1
    - name: type1-3
      id: type1-3
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: type1-3
        setup-command: ''
        command: javac -cp utilities/antlr-4.13.1-complete.jar -d out $(find src gen
          -name "*.java") && java -cp out:utilities/antlr-4.13.1-complete.jar SimpleLang
          "samples/type1-3.sl"
        input: ''
        expected-output: |-
          0 1
          1 1
          2 1
          3 1
          4 3
          7 3
          10 7
          17 7
        comparison-method: contains
        timeout: 10
        max-score: 1
    - name: type1-4
      id: type1-4
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: type1-4
        setup-command: ''
        command: javac -cp utilities/antlr-4.13.1-complete.jar -d out $(find src gen
          -name "*.java") && java -cp out:utilities/antlr-4.13.1-complete.jar SimpleLang
          "samples/type1-4.sl"
        input: ''
        expected-output: |-
          0
          2
          4
          6
          8
          10
        comparison-method: contains
        timeout: 10
        max-score: 1
    - name: type1-5
      id: type1-5
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: type1-5
        setup-command: ''
        command: javac -cp utilities/antlr-4.13.1-complete.jar -d out $(find src gen
          -name "*.java") && java -cp out:utilities/antlr-4.13.1-complete.jar SimpleLang
          "samples/type1-5.sl"
        input: ''
        expected-output: |-
          0
          14
        comparison-method: contains
        timeout: 10
        max-score: 1
    - name: type2-1
      id: type2-1
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: type2-1
        setup-command: ''
        command: javac -cp utilities/antlr-4.13.1-complete.jar -d out $(find src gen
          -name "*.java") && java -cp out:utilities/antlr-4.13.1-complete.jar SimpleLang
          "samples/type2-1.sl"
        input: ''
        expected-output: |-
          4 6.0 -3
          0
          0
          0
          4 6.0 -3
          9
          3.0
          0
        comparison-method: contains
        timeout: 10
        max-score: 1
    - name: type3-1
      id: type3-1
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: type3-1
        setup-command: ''
        command: javac -cp utilities/antlr-4.13.1-complete.jar -d out $(find src gen
          -name "*.java") && java -cp out:utilities/antlr-4.13.1-complete.jar SimpleLang
          "samples/type3-1.sl"
        input: ''
        expected-output: |-
          0
          14
        comparison-method: contains
        timeout: 10
        max-score: 1
    - name: type4-1
      id: type4-1
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: type4-1
        setup-command: ''
        command: javac -cp utilities/antlr-4.13.1-complete.jar -d out $(find src gen
          -name "*.java") && java -cp out:utilities/antlr-4.13.1-complete.jar SimpleLang
          "samples/type4-1.sl"
        input: ''
        expected-output: |-
          2 4.0 -2
          0
          2 4.0 10
          5
          2 4.0 18
          17
          2 4.0 18
          25
        comparison-method: contains
        timeout: 10
        max-score: 1
    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        TYPE1-1_RESULTS: "${{steps.type1-1.outputs.result}}"
        TYPE1-2_RESULTS: "${{steps.type1-2.outputs.result}}"
        TYPE1-3_RESULTS: "${{steps.type1-3.outputs.result}}"
        TYPE1-4_RESULTS: "${{steps.type1-4.outputs.result}}"
        TYPE1-5_RESULTS: "${{steps.type1-5.outputs.result}}"
        TYPE2-1_RESULTS: "${{steps.type2-1.outputs.result}}"
        TYPE3-1_RESULTS: "${{steps.type3-1.outputs.result}}"
        TYPE4-1_RESULTS: "${{steps.type4-1.outputs.result}}"
      with:
        runners: type1-1,type1-2,type1-3,type1-4,type1-5,type2-1,type3-1,type4-1
